name: Build Static Files

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - name: Build for Xserver
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /aga1lp

      - name: Fix image paths for Xserver
        run: |
          find out -type f \( -name "*.html" -o -name "*.js" -o -name "*.css" \) -exec sed -i 's|/images/|/aga1lp/images/|g' {} +

      - uses: actions/upload-artifact@v4
        with:
          name: xserver-files
          path: out
